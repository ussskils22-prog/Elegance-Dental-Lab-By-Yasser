<div
  class="masar-lockup"
  [class.masar-lockup--hero]="layout === 'hero'"
  [class.masar-lockup--light]="tone === 'light'"
>
  <!-- OCCLA mark: upper and lower arch closing on each other (occlusion). Fixed brand colors. -->
  <svg class="masar-mark" viewBox="0 0 48 48" aria-hidden="true">
    <path fill="#1D9E75" d="M6 22c3-11 12-14 18-7 6-7 15-4 18 7z" />
    <path fill="#EF9F27" d="M6 26c3 11 12 14 18 7 6 7 15 4 18-7z" />
  </svg>
  <div class="masar-text">
    <span class="masar-product">OCCLA</span>
    @if (showLab) {
      <span class="masar-lab">{{ labName }}</span>
    }
  </div>
</div>
