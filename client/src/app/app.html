@if (demoModeSvc.demoMode()) {
  <div class="demo-mode-banner" role="status" aria-live="polite" dir="rtl">
    وضع تجريبي — بيانات وهمية · Admin Demo · مش داتا المعمل الحقيقية
  </div>
}

@if (swUpdate.updateReady()) {
  <div class="sw-update-banner" role="status" aria-live="polite" dir="rtl">
    <span>فيه تحديث جديد للنظام</span>
    <button
      type="button"
      class="sw-update-btn"
      (click)="swUpdate.applyNow()"
      [disabled]="swUpdate.applying()"
    >
      {{ swUpdate.applying() ? 'جاري التحديث…' : 'حدّث الآن' }}
    </button>
  </div>
}

@if (!authReady()) {
  <div class="app-boot" role="status" aria-live="polite">
    <div class="app-boot-spinner" aria-hidden="true"></div>
    <p class="app-boot-text">جاري التحقق من الجلسة…</p>
  </div>
} @else {
  <main class="main">
    <router-outlet />
  </main>
}
