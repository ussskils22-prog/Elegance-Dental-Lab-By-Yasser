<div class="doctor-request-rep-page" [attr.dir]="lang.dir()">
  <header class="drr-topbar">
    <button type="button" class="drr-back-btn" (click)="backToDashboard()" [attr.aria-label]="'doctorPages.backAria' | t">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" width="18" height="18" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
      <span>{{ 'common.back' | t }}</span>
    </button>

    <div class="drr-brand">
      <app-brand-lockup></app-brand-lockup>
    </div>

    <div class="drr-top-actions">
      <app-overflow-menu></app-overflow-menu>
      <button
        type="button"
        class="drr-icon-btn"
        [attr.aria-label]="'common.theme' | t"
        [attr.title]="'common.theme' | t"
        (click)="themeService.toggleTheme()"
      >
        <svg *ngIf="!themeService.isDarkMode()" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg *ngIf="themeService.isDarkMode()" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="drr-main">
    <section class="drr-panel" aria-labelledby="drr-title">
      <div class="drr-orbit" aria-hidden="true">
        <span class="drr-ring"></span>
        <span class="drr-ring drr-ring--late"></span>
        <div class="drr-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" width="34" height="34">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13l2-5h14l2 5" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13h14v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-5z" />
            <circle cx="7.5" cy="18.5" r="1.5" />
            <circle cx="16.5" cy="18.5" r="1.5" />
          </svg>
        </div>
      </div>
      <p class="drr-eyebrow">{{ 'doctorPages.rep.eyebrow' | t }}</p>
      <h1 id="drr-title">{{ 'doctorPages.rep.title' | t }}</h1>
      <p class="drr-lead">{{ leadText() }}</p>
      <button type="button" class="drr-cta" (click)="backToDashboard()">{{ 'doctorPages.rep.cta' | t }}</button>
    </section>
  </main>
</div>
